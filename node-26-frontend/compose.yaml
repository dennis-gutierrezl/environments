services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: "${APP_NAME:-default}-app"
    ports:
      - "${APP_FORWARD_PORT:-5173}:5173"
    volumes:
      - .:/app:cached
      - pnpm-store:/home/node/.local/share/pnpm/store
    restart: unless-stopped

volumes:
  pnpm-store:
