include:
  - infrastructure.yaml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: "${APP_NAME:-default}-app"
    ports:
      - "${APP_FORWARD_PORT:-3000}:3000"
    networks:
      - app-network
    volumes:
      - .:/app:cached
      - pnpm-store:/home/node/.local/share/pnpm/store
    restart: unless-stopped

networks:
  app-network:
    name: "${APP_NAME:-default}-network"
    driver: bridge

volumes:
  pnpm-store:
